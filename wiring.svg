  <text x="1056" y="511" font-size="16" font-weight="700" fill="#222" text-anchor="middle">–</text>
  <text x="980" y="552" font-size="14" font-weight="700" fill="#1b1b1b" text-anchor="middle">2× 18650 · 7.4V</text>

  <!-- NodeMCU Base, the NodeMCU sits in it -->
  <rect x="1290" y="462" width="24" height="36" rx="3" fill="#9e9e9e"/>
  <rect x="1326" y="420" width="220" height="125" rx="8" fill="#263238"/>
  <rect x="1312" y="468" width="20" height="24" rx="2" fill="#111"/>
  <text x="1336" y="510" font-size="11" fill="#cfd8dc">DC jack</text>
  <text x="1452" y="462" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">NodeMCU Base</text>
  <text x="1452" y="480" font-size="12" fill="#cfd8dc" text-anchor="middle">Ver 1.0 · NodeMCU sits in it</text>
  <g fill="#f2b705" stroke="#7a5c00" stroke-width="1.5">
