    <text x="886" y="978">OLED (SSD1306)</text>
    <text x="1236" y="978">DFPlayer Mini</text>
  </g>

  <!-- L298N card -->
  <circle cx="894" cy="803" r="6" fill="#15803d"/>
  <circle cx="894" cy="827" r="6" fill="#65a30d"/>
  <circle cx="894" cy="851" r="6" fill="#be185d"/>
  <circle cx="894" cy="875" r="6" fill="#ec4899"/>
  <circle cx="894" cy="899" r="6" fill="#777"/>
  <circle cx="894" cy="923" r="6" fill="#777"/>
  <g font-size="15" font-weight="700" fill="#1b1b1b">
    <text x="908" y="808">IN1</text><text x="908" y="832">IN2</text><text x="908" y="856">IN3</text>
    <text x="908" y="880">IN4</text><text x="908" y="904">OUT1, OUT2</text><text x="908" y="928">OUT3, OUT4</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="1020" y="808">NodeMCU D5</text><text x="1020" y="832">NodeMCU D6</text><text x="1020" y="856">NodeMCU D7</text>
    <text x="1020" y="880">NodeMCU D8</text><text x="1020" y="904">left motor</text><text x="1020" y="928">right motor</text>
  </g>

  <!-- MG995 card -->
  <circle cx="1244" cy="803" r="6" fill="#7a4a1f"/>
  <circle cx="1244" cy="827" r="6" fill="#d62828"/>
  <circle cx="1244" cy="851" r="6" fill="#f07f13"/>
  <g font-size="15" font-weight="700" fill="#1b1b1b">
    <text x="1258" y="808">brown</text><text x="1258" y="832">red</text><text x="1258" y="856">orange</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="1370" y="808">servo supply –</text><text x="1370" y="832">servo supply +</text><text x="1370" y="856">NodeMCU D0</text>
  </g>
  <text x="1238" y="896" font-size="14" font-weight="700" fill="#b00020">Never power it from the L298N or base 5V.</text>

  <!-- OLED card -->
  <circle cx="894" cy="1003" r="6" fill="#222"/>
  <circle cx="894" cy="1027" r="6" fill="#d62828"/>
  <circle cx="894" cy="1051" r="6" fill="#d9a400"/>
  <circle cx="894" cy="1075" r="6" fill="#2563eb"/>
  <g font-size="15" font-weight="700" fill="#1b1b1b">
    <text x="908" y="1008">GND</text><text x="908" y="1032">VCC</text><text x="908" y="1056">SCL</text><text x="908" y="1080">SDA</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="1020" y="1008">NodeMCU G</text><text x="1020" y="1032">NodeMCU 3V</text>
    <text x="1020" y="1056">NodeMCU D1</text><text x="1020" y="1080">NodeMCU D2</text>
  </g>

  <!-- DFPlayer card -->
  <circle cx="1244" cy="1003" r="6" fill="#d62828"/>
  <circle cx="1244" cy="1027" r="6" fill="#222"/>
  <circle cx="1244" cy="1051" r="6" fill="#7c3aed"/>
  <circle cx="1244" cy="1075" r="6" fill="#ccc"/>
  <circle cx="1244" cy="1099" r="6" fill="#777"/>
  <g font-size="15" font-weight="700" fill="#1b1b1b">
    <text x="1258" y="1008">VCC</text><text x="1258" y="1032">GND</text><text x="1258" y="1056">RX</text>
    <text x="1258" y="1080">TX</text><text x="1258" y="1104">SPK_1, SPK_2</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="1370" y="1008">Base 5V pin, not VIN</text><text x="1370" y="1032">Base G, next to 5V</text>
    <text x="1370" y="1056">D4 through 1kΩ</text><text x="1370" y="1080" fill="#999">not connected</text>
    <text x="1370" y="1104">speaker, pins 6 + 8</text>
  </g>

  <!-- ============ Watch out ============ -->
  <circle cx="66" cy="1001" r="14" fill="#b00020"/>
  <text x="66" y="1007" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">!</text>
  <text x="90" y="1008" font-size="22" font-weight="700" fill="#b00020">Watch out</text>
  <g font-size="15" fill="#333">
    <text x="60" y="1040">• DFPlayer VCC goes on the base's 5V pin, never VIN. VIN carries the battery's 7.4V and kills it.</text>
    <text x="60" y="1064">• Pull out the old L298N +5V → VIN wire. The base powers the NodeMCU now.</text>
    <text x="60" y="1088">• Speaker on DFPlayer pins 6 + 8 (SPK_1, SPK_2), never pin 7 (GND).</text>
    <text x="60" y="1112">• PAM8403 later: 5V+/5V– on the base 5V/G, DAC_L/DAC_R → L/R in, speaker on L+ and L–, never GND.</text>
    <text x="60" y="1136">• The old PC buzzer stays off D0. Head twitches? Check the servo supply ground first.</text>
  </g>
</svg>
