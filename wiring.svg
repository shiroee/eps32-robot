  </g>
  <text x="1412" y="622" font-size="12" fill="#b00020">VIN has the battery's 7.4V,</text>
  <text x="1412" y="637" font-size="12" fill="#b00020">never the DFPlayer</text>

  <!-- servo supply -->
  <rect x="1125" y="590" width="180" height="60" rx="8" fill="#455a64"/>
  <text x="1215" y="615" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Servo supply 5–6V</text>
  <text x="1215" y="636" font-size="12" fill="#cfd8dc" text-anchor="middle">+ → MG995 red wire</text>

