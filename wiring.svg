  <circle cx="886" cy="726" r="14" fill="#1b1b1b"/>
  <text x="886" y="732" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="910" y="733" font-size="22" font-weight="700" fill="#1b1b1b">Each part</text>

