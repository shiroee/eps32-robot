    <text x="590" y="306">MG995 signal<tspan font-size="14" font-weight="400" fill="#777"> · orange wire</tspan></text>
    <text x="590" y="346">OLED SCL</text>
    <text x="590" y="386">OLED SDA</text>
    <text x="590" y="466">DFPlayer RX<tspan font-size="14" font-weight="400" fill="#777"> · through 1kΩ</tspan></text>
    <text x="590" y="506">OLED VCC</text>
    <text x="590" y="546">OLED GND</text>
    <text x="590" y="586">L298N IN1<tspan font-size="14" font-weight="400" fill="#777"> · left motor</tspan></text>
    <text x="590" y="626">L298N IN2<tspan font-size="14" font-weight="400" fill="#777"> · left motor</tspan></text>
    <text x="590" y="666">L298N IN3<tspan font-size="14" font-weight="400" fill="#777"> · right motor</tspan></text>
    <text x="590" y="706">L298N IN4<tspan font-size="14" font-weight="400" fill="#777"> · right motor</tspan></text>
  </g>
  <g font-size="15" fill="#9a9a9a">
    <text x="590" y="426">free · boot pin, avoid</text>
    <text x="590" y="746">free</text>
    <text x="590" y="786">free</text>
    <text x="320" y="306" text-anchor="end">free</text>
    <text x="320" y="866" text-anchor="end">no wire · the base powers it</text>
  </g>
  <g font-size="16" font-weight="700" fill="#1b1b1b" text-anchor="end">
    <text x="245" y="826">L298N GND<tspan font-size="14" font-weight="400" fill="#777"> · shared ground</tspan></text>
  </g>
  <text x="54" y="915" font-size="13" fill="#888">All G pins are joined inside the board, so any one works.</text>

  <!-- ============ 2. Power & motors ============ -->
  <circle cx="886" cy="161" r="14" fill="#1b1b1b"/>
  <text x="886" y="167" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="910" y="168" font-size="22" font-weight="700" fill="#1b1b1b">Power &amp; motors</text>
  <text x="910" y="192" font-size="14" fill="#666">The battery feeds both the L298N and the base's DC jack.</text>

